name: Deploy app.urclass.id

on:
  push:
    branches: [main]
  workflow_dispatch:

# Hostinger builds on the server; two overlapping builds would fight over
# the same hbuilds/current symlink.
concurrency:
  group: deploy-app-urclass
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload, build on Hostinger, verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BASE_URL: https://app.urclass.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No npm install and no next build here: Hostinger's Node hosting runs
      # the build itself from an uploaded source archive, and serves the
      # result through Passenger. Building here too would just be discarded.
      - name: Upload source and build on Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          # This repo is public, so the hosting account name is a secret too.
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          FE_ENV_PRODUCTION: ${{ secrets.FE_ENV_PRODUCTION }}
        run: python -u scripts/deploy-hostinger.py

      - name: Verify the site
        run: |
          fail=0
          probe() { # label, expected status, curl args...
            label="$1"; want="$2"; shift 2
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' "$@")
              [ "$code" = "$want" ] && break
              sleep 6
            done
            if [ "$code" = "$want" ]; then
              echo "  PASS  $label  -> $code"
            else
              echo "  FAIL  $label  -> $code (expected $want)"
              head -c 300 /tmp/body; echo
              fail=1
            fi
          }
          blocked() { # label, curl args... - passes on any 401/403/404
            label="$1"; shift
            code=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            case "$code" in
              401|403|404) echo "  PASS  $label  -> $code (blocked)" ;;
              *) echo "  FAIL  $label  -> $code (expected it to be blocked)"; fail=1 ;;
            esac
          }

          echo "===== verification ====="

          # src/proxy.ts (Next 16's renamed middleware) sends guests to
          # /login, so 307 here is correct and also proves middleware runs.
          probe "/                 middleware redirects guests" 307 "$BASE_URL/"

          # Passenger boots the Next server on first request, so this doubles
          # as the cold-start check.
          probe "/login            page renders"                200 "$BASE_URL/login"

          # next-auth's own endpoint: proves the server route works, not just
          # prerendered pages.
          probe "/api/auth/providers  next-auth route"          200 \
            -H 'Accept: application/json' "$BASE_URL/api/auth/providers"

          # Passenger serves from hbuilds/, outside the document root, so
          # source and env must not be fetchable at all.
          blocked "/.env.production  env not web-readable"    "$BASE_URL/.env.production"
          blocked "/package.json     source not web-readable" "$BASE_URL/package.json"

          echo "--- headers on /login"
          curl -sD - -o /dev/null "$BASE_URL/login" \
            | grep -iE 'content-security-policy|strict-transport|x-frame-options|x-content-type' \
            | cut -c1-100

          # The CSP from next.config.ts does not reach the client on this host:
          # LiteSpeed replaces it. Compare against the Laravel backend, which
          # sets no CSP of its own - if both serve the same value, it is
          # injected by the platform and no app-level CSP will ever apply here.
          app_csp=$(curl -sD - -o /dev/null "$BASE_URL/login" \
                    | grep -i '^content-security-policy:' | tr -d '\r' || true)
          be_csp=$(curl -sD - -o /dev/null https://prod-api.urclass.id/up \
                   | grep -i '^content-security-policy:' | tr -d '\r' || true)
          echo "--- csp origin check"
          echo "  app.urclass.id      : ${app_csp:-(none)}" | cut -c1-140
          echo "  prod-api.urclass.id : ${be_csp:-(none)}" | cut -c1-140

          if printf '%s' "$app_csp" | grep -q 'prod-api.urclass.id'; then
            echo "  PASS  the app's own CSP is being served"
          elif [ -n "$be_csp" ] && [ "$app_csp" = "$be_csp" ]; then
            echo "::warning::LiteSpeed injects '$app_csp' and drops the CSP from \
          next.config.ts - the same value is served by the Laravel backend, which \
          sets no CSP. Nothing is blocked, but that carefully written policy is inert."
          else
            echo "::warning::the app CSP is not being served and the cause is unclear \
          (app='${app_csp:-none}' backend='${be_csp:-none}') - worth checking by hand."
          fi

          [ "$fail" = 0 ] || { echo "::error::verification failed"; exit 1; }
          echo "===== FE is live ====="
